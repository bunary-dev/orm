[test]
coverage = true
coverageSkipTestFiles = true
# Bun enforces coverageThreshold per file, not on the aggregate, so this is
# bounded by the least-covered file.
# Aggregate coverage is currently 100% lines / 100% functions (SQLite run;
# the Postgres suite needs TEST_POSTGRES_URL).
coverageThreshold = { lines = 0.95, functions = 0.95 }
